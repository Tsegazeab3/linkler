name: Linkler CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test_and_build:
    name: 🧪 Run Tests & Build Assets
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Run Backend System Check & Migrations (SQLite Test Mode)
        env:
          USE_SQLITE: "True"
          USE_R2: "False"
          SECRET_KEY: "ci-testing-secret-key"
          DEBUG: "True"
        run: |
          cd backend
          python manage.py check
          python manage.py migrate --noinput
          python manage.py test accounts posts discovery chat --noinput

      - name: ⚡ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 🛠️ Install Frontend Dependencies & Build Bundle
        run: |
          cd frontend
          npm ci
          npm run build

  deploy:
    name: 🚀 Deploy to Production (Google Cloud Run)
    needs: test_and_build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🔧 Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 🐳 Build & Deploy Cloud Run Service
        run: |
          echo "Deploying to Google Cloud Run with Production Supabase PostgreSQL and Cloudflare R2..."
          # Example Cloud Run deploy command:
          # gcloud run deploy linkler-app \
          #   --source . \
          #   --region us-central1 \
          #   --allow-unauthenticated \
          #   --set-env-vars USE_SQLITE=False,USE_R2=True
