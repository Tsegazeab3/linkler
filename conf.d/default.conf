server {
    listen 80;
    server_name localhost linkler.chickenkiller.com _;

    # Docker embedded DNS resolver to dynamically resolve upstream container hostname
    resolver 127.0.0.11 valid=30s;
    set $django_backend http://web:8000;

    # Root directory for Vite React static build
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: forward all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Django API requests
    location /api/ {
        proxy_pass $django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Django Admin interface
    location /admin/ {
        proxy_pass $django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Django AllAuth endpoints
    location /accounts/ {
        proxy_pass $django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket connections (Django Channels / Chat)
    location /ws/ {
        proxy_pass $django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Serve uploaded media files directly or proxy to backend
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @proxy_media;
    }

    location @proxy_media {
        proxy_pass $django_backend;
        proxy_set_header Host $host;
    }

    # Serve backend static files (Django Rest Framework / Admin CSS & JS)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @proxy_static;
    }

    location @proxy_static {
        proxy_pass $django_backend;
        proxy_set_header Host $host;
    }
}
